apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logstash.fullname" . }}
  labels:
    {{- include "logstash.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "logstash.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "logstash.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
      - name: logstash
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 9600
          protocol: TCP
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: {{ .Values.config.kafka.bootstrapServers | quote }}
        - name: KAFKA_TOPIC
          value: {{ .Values.config.kafka.topic | quote }}
        - name: KAFKA_GROUP_ID
          value: {{ .Values.config.kafka.groupId | quote }}
        - name: ELASTICSEARCH_HOSTS
          value: {{ .Values.config.elasticsearch.hosts | toJson | quote }}
        - name: ELASTICSEARCH_INDEX
          value: {{ .Values.config.elasticsearch.index | quote }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /usr/share/logstash/config
        - name: pipeline
          mountPath: /usr/share/logstash/pipeline
      volumes:
      - name: config
        configMap:
          name: {{ include "logstash.fullname" . }}-config
      - name: pipeline
        configMap:
          name: {{ include "logstash.fullname" . }}-pipeline