server:
  port: 8087

spring:
  # Service Discovery
  application:
    name: service-notifications

  main:
    allow-bean-definition-overriding: true # убрать после dev

  # Cloud
  cloud:

  # Security
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8180/realms/bankapp/protocol/openid-connect/certs

  # Liquibase
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    drop-first: true

  # Datasource (reactive)
  r2dbc:
    url: r2dbc:postgresql://localhost:5434/notifications-db
    username: postgres
    password: postgres

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:kafka:29092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: ru.mdemidkin.*
        allow.auto.create.topics: true
    listener:
      ack-mode: ${KAFKA_ACK_MODE:record}
      observation-enabled: true
    template:
      observation-enabled: true

kafka-topics:
  notifications-topic: topic-bankapp-notifications

headers:
  user-header: X-User-Login

management:
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  tracing:
    sampling:
      probability: 1
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

logging:
  level:
    web: info
    org.springframework.security: info

services:
  service-gateway:
    name: "bankapp-service-gateway:8080"